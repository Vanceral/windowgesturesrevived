name: Build extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-bin zip unzip
      - name: Build extension
        run: ./build.sh
      - name: Check archive
        run: unzip -t windowgesturesrevived@vanceral.github.io.zip
