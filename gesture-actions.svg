  <title id="title">Window gestures for sizing, peeking, and pinching</title>
  <desc id="desc">A matching three-panel illustration shows four-finger swipes cycling a window from restored to maximized to fullscreen and back, three-finger swipe and pinch examples, and four-finger pinch actions selected in preferences.</desc>
