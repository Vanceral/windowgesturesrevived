<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc">
  <title id="title">Window gestures for sizing, peeking, and pinching</title>
  <desc id="desc">A matching three-panel illustration shows four-finger swipes cycling a window from restored to maximized to fullscreen and back, three-finger swipe and pinch examples, and four-finger pinch actions selected in preferences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202035"/><stop offset="1" stop-color="#10121d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7a4ff"/><stop offset="1" stop-color="#8d68f5"/></linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#424276"/><stop offset="1" stop-color="#242642"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#b99aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:Cantarell,Inter,"Segoe UI",sans-serif}.muted{fill:#b4b4cb}.bright{fill:#f7f4ff}.label{fill:#c6aaff;font-size:14px;font-weight:700;letter-spacing:1.5px}.step{fill:#161624;stroke:#3a3853;stroke-width:1.5}.mini{fill:#292a38;stroke:#6b6680;stroke-width:1.5}.arrow{fill:none;stroke:#b99aff;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="910" rx="30" fill="url(#bg)"/><circle cx="1320" cy="90" r="110" fill="#8d68f5" opacity=".08"/><circle cx="1260" cy="780" r="170" fill="#4c7cff" opacity=".055"/><path d="M1185 0L1440 0L1440 235Z" fill="#a889ff" opacity=".035"/>
  <text x="72" y="77" class="label">WINDOW GESTURES REVIVED · MORE WAYS TO WORK</text><text x="72" y="132" fill="#fff" font-size="42" font-weight="700">Size it, peek, and make it yours</text><text x="72" y="169" fill="#d1d0e0" font-size="17">A few useful mappings. Change the configurable actions to suit your setup.</text>
  <g transform="translate(58 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">1</text><text x="70" y="48" class="bright" font-size="21" font-weight="700">Four-finger window sizing</text><text x="30" y="82" class="muted" font-size="14">Swipe up to grow it; down to step back.</text>
    <text x="53" y="123" class="label" font-size="11">UP</text><text x="343" y="123" class="label" font-size="11">DOWN</text><path d="M76 344V164" class="arrow"/><path d="M336 164V344" class="arrow"/>
    <g transform="translate(113 139)"><rect width="185" height="75" rx="12" fill="#25243a" stroke="#625b82"/><text x="92" y="30" text-anchor="middle" fill="#d7c8ff" font-size="13" font-weight="700">FULLSCREEN</text><rect x="44" y="44" width="97" height="20" rx="3" fill="url(#wallpaper)"/><text x="92" y="58" text-anchor="middle" fill="#f6f4fa" font-size="8">App fills the screen</text></g>
    <g transform="translate(113 240)"><rect width="185" height="75" rx="12" fill="#25243a" stroke="#625b82"/><text x="92" y="30" text-anchor="middle" fill="#d7c8ff" font-size="13" font-weight="700">MAXIMIZED</text><rect x="25" y="42" width="135" height="24" rx="3" fill="#f5f3fa"/><path d="M28 42H157a3 3 0 0 1 3 3v6H25v-6a3 3 0 0 1 3-3Z" fill="#39394f"/><text x="92" y="61" text-anchor="middle" fill="#5b586d" font-size="8">Window fills the work area</text></g>
    <g transform="translate(113 341)"><rect width="185" height="75" rx="12" fill="#25243a" stroke="#625b82"/><text x="92" y="30" text-anchor="middle" fill="#d7c8ff" font-size="13" font-weight="700">RESTORED</text><rect x="44" y="41" width="97" height="27" rx="4" fill="#f5f3fa"/><path d="M48 41H137a4 4 0 0 1 4 4v6H44v-6a4 4 0 0 1 4-4Z" fill="#39394f"/><text x="92" y="63" text-anchor="middle" fill="#5b586d" font-size="8">Window at its own size</text></g>
    <text x="30" y="448" fill="#e5e0f1" font-size="13" font-weight="600">Up again: maximized → fullscreen</text><text x="30" y="473" fill="#e5e0f1" font-size="13" font-weight="600">Down: fullscreen → maximized → restored</text><rect x="25" y="493" width="362" height="54" rx="12" fill="#28233c" stroke="#6e5b9f"/><text x="42" y="516" fill="#d9c8ff" font-size="12" font-weight="700">ONE MORE DOWN?</text><text x="42" y="536" class="muted" font-size="11">Assign Minimize to the configurable swipe-down action.</text>
  </g>
  <g transform="translate(514 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">2</text><text x="70" y="48" class="bright" font-size="21" font-weight="700">Three-finger shortcuts</text><text x="30" y="82" class="muted" font-size="14">Peek at the desktop or tuck a window away.</text>
    <g transform="translate(24 112)"><rect width="364" height="116" rx="16" fill="#202033" stroke="#393750"/><g transform="translate(18 23)"><rect width="104" height="68" rx="7" fill="url(#wallpaper)"/><rect x="14" y="16" width="76" height="42" rx="5" fill="#f4f2f8"/><path d="M19 16H85a5 5 0 0 1 5 5v7H14v-7a5 5 0 0 1 5-5Z" fill="#39394f"/><text x="52" y="43" text-anchor="middle" fill="#5c5870" font-size="8">Desktop</text></g><path d="M146 55V83" class="arrow"/><text x="178" y="39" class="label" font-size="10">SWIPE DOWN</text><text x="178" y="64" fill="#f7f4ff" font-size="15" font-weight="700">Show desktop</text><text x="178" y="85" class="muted" font-size="11">Quickly reveal your workspace.</text><g transform="translate(297 28)"><circle cx="10" cy="7" r="6" fill="url(#accent)"/><circle cx="27" cy="7" r="6" fill="url(#accent)"/><circle cx="44" cy="7" r="6" fill="url(#accent)"/></g></g>
    <g transform="translate(24 246)"><rect width="364" height="116" rx="16" fill="#202033" stroke="#393750"/><g transform="translate(22 30)"><rect width="93" height="61" rx="10" class="mini"/><path d="M24 16L69 46M69 16L24 46" stroke="#b99aff" stroke-width="2.5" stroke-linecap="round"/><circle cx="46" cy="31" r="5" fill="#d7c8ff"/></g><path d="M145 83L157 61" class="arrow"/><text x="178" y="33" class="label" font-size="10">PINCH IN</text><text x="178" y="58" fill="#f7f4ff" font-size="15" font-weight="700">Minimize window</text><text x="178" y="80" class="muted" font-size="11">The default three-finger action.</text><g transform="translate(297 28)"><circle cx="10" cy="7" r="6" fill="url(#accent)"/><circle cx="27" cy="7" r="6" fill="url(#accent)"/><circle cx="44" cy="7" r="6" fill="url(#accent)"/><path d="M9 7H0M28 7H18M46 7H56" stroke="#d7c8ff" stroke-width="1.5"/></g></g>
    <g transform="translate(24 380)"><rect width="364" height="116" rx="16" fill="#202033" stroke="#393750"/><g transform="translate(18 23)"><rect width="104" height="68" rx="7" fill="url(#wallpaper)"/><rect x="14" y="16" width="76" height="42" rx="5" fill="#f4f2f8"/><path d="M19 16H85a5 5 0 0 1 5 5v7H14v-7a5 5 0 0 1 5-5Z" fill="#39394f"/><text x="52" y="43" text-anchor="middle" fill="#5c5870" font-size="8">Desktop</text></g><path d="M145 77L157 57" class="arrow"/><text x="178" y="33" class="label" font-size="10">PINCH OUT</text><text x="178" y="58" fill="#f7f4ff" font-size="15" font-weight="700">Show desktop</text><text x="178" y="80" class="muted" font-size="11">A second way to peek.</text><g transform="translate(297 28)"><circle cx="10" cy="7" r="6" fill="url(#accent)"/><circle cx="27" cy="7" r="6" fill="url(#accent)"/><circle cx="44" cy="7" r="6" fill="url(#accent)"/><path d="M4 7H-5M27 7H17M50 7H60" stroke="#d7c8ff" stroke-width="1.5"/></g></g>
    <text x="206" y="538" text-anchor="middle" class="muted" font-size="12">These three-finger mappings are customizable.</text>
  </g>
  <g transform="translate(970 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">3</text><text x="70" y="48" class="bright" font-size="21" font-weight="700">Make pinches your own</text><text x="30" y="82" class="muted" font-size="14">Pick an action for either four-finger pinch.</text>
    <g transform="translate(26 115)"><rect width="360" height="122" rx="16" fill="#202033" stroke="#393750"/><text x="22" y="29" class="label" font-size="11">PINCH IN · 4 FINGERS</text><g transform="translate(25 48)"><rect width="92" height="54" rx="11" class="mini"/><g fill="url(#accent)"><circle cx="27" cy="18" r="6"/><circle cx="64" cy="18" r="6"/><circle cx="27" cy="36" r="6"/><circle cx="64" cy="36" r="6"/></g><path d="M23 18L39 27M68 18L52 27M23 36L39 27M68 36L52 27" stroke="#d7c8ff" stroke-width="1.6"/></g><path d="M138 75H179" class="arrow"/><rect x="194" y="46" width="141" height="52" rx="10" fill="#302a46" stroke="#8c72c2"/><text x="264" y="67" text-anchor="middle" fill="#f7f4ff" font-size="11" font-weight="700">Choose an action</text><text x="264" y="85" text-anchor="middle" class="muted" font-size="10">in Preferences</text></g>
    <g transform="translate(26 253)"><rect width="360" height="122" rx="16" fill="#202033" stroke="#393750"/><text x="22" y="29" class="label" font-size="11">PINCH OUT · 4 FINGERS</text><g transform="translate(25 48)"><rect width="92" height="54" rx="11" class="mini"/><g fill="url(#accent)"><circle cx="38" cy="18" r="6"/><circle cx="53" cy="18" r="6"/><circle cx="38" cy="36" r="6"/><circle cx="53" cy="36" r="6"/></g><path d="M41 18L24 9M50 18L67 9M41 36L24 46M50 36L67 46" stroke="#d7c8ff" stroke-width="1.6"/></g><path d="M138 75H179" class="arrow"/><rect x="194" y="46" width="141" height="52" rx="10" fill="#302a46" stroke="#8c72c2"/><text x="264" y="67" text-anchor="middle" fill="#f7f4ff" font-size="11" font-weight="700">Choose an action</text><text x="264" y="85" text-anchor="middle" class="muted" font-size="10">in Preferences</text></g>
    <g transform="translate(26 405)"><rect width="360" height="118" rx="16" fill="#28233c" stroke="#6e5b9f"/><text x="22" y="31" fill="#d9c8ff" font-size="13" font-weight="700">Your gestures, your workflow</text><text x="22" y="55" class="muted" font-size="12">Swipe and pinch actions can be changed</text><text x="22" y="75" class="muted" font-size="12">in the extension preferences.</text><path d="M304 33L311 40L326 22" fill="none" stroke="#b99aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="206" y="550" text-anchor="middle" class="muted" font-size="12">Four-finger pinch is off until you assign an action.</text>
  </g>
  <text x="72" y="850" fill="#aba9bd" font-size="14">Examples reflect the extension's default mappings. The four-finger up/down state cycle is built in; configurable actions depend on Preferences.</text><text x="72" y="877" fill="#77768b" font-size="12">Window Gestures Revived · GNOME Shell extension · Visual guide, not a GNOME Shell screenshot</text>
</svg>
