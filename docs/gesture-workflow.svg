<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc">
  <title id="title">Move a window, then move on</title>
  <desc id="desc">Three illustrated steps show a four-finger swipe moving the focused window to the adjacent workspace, followed by a three-finger swipe to continue to another workspace. The moved window remains on its destination workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202035"/><stop offset="1" stop-color="#10121d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7a4ff"/><stop offset="1" stop-color="#8d68f5"/></linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#424276"/><stop offset="1" stop-color="#242642"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05060a" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#b99aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:Cantarell,Inter,"Segoe UI",sans-serif}.muted{fill:#b4b4cb}.bright{fill:#f7f4ff}.label{fill:#c6aaff;font-size:14px;font-weight:700;letter-spacing:1.6px}.title{fill:#fff;font-size:30px;font-weight:700}.body{fill:#d1d0e0;font-size:17px}.step{fill:#161624;stroke:#3a3853;stroke-width:1.5}</style>
  </defs>
  <rect width="1440" height="910" rx="30" fill="url(#bg)"/><circle cx="1320" cy="90" r="110" fill="#8d68f5" opacity=".08"/><circle cx="1260" cy="780" r="170" fill="#4c7cff" opacity=".055"/><path d="M1185 0L1440 0L1440 235Z" fill="#a889ff" opacity=".035"/>
  <text x="72" y="77" class="label">WINDOW GESTURES REVIVED · THE WORKSPACE FLOW</text><text x="72" y="132" class="title" style="font-size:42px">Move a window, then move on</text><text x="72" y="169" class="body">Send the focused window to the next workspace. Keep navigating at your own pace.</text>
  <g transform="translate(58 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">1</text><text x="70" y="48" class="bright" font-size="22" font-weight="700">Grab the focused window</text><text x="30" y="82" class="muted" font-size="15">Start a four-finger swipe across the touchpad.</text>
    <g transform="translate(28 111)" filter="url(#shadow)"><rect width="356" height="236" rx="13" fill="#11121b" stroke="#6a5d91" stroke-width="2"/><path d="M13 0H343a13 13 0 0 1 13 13v24H0V13A13 13 0 0 1 13 0Z" fill="#2b2a3c"/><text x="22" y="25" fill="#eeeaf8" font-size="12" font-weight="600">Activities</text><text x="178" y="25" fill="#d7d3e4" font-size="11" text-anchor="middle">Tue 10:08</text><circle cx="324" cy="18" r="3" fill="#c4b5e8"/><rect y="37" width="356" height="199" fill="url(#wallpaper)"/><circle cx="285" cy="101" r="85" fill="#df8ac8" opacity=".12"/><path d="M14 204C84 132 112 175 160 121S250 97 342 149V199H14Z" fill="#7766ac" opacity=".46"/><g transform="translate(79 79)"><rect width="200" height="110" rx="9" fill="#f6f4fa"/><path d="M9 0H191a9 9 0 0 1 9 9v21H0V9a9 9 0 0 1 9-9Z" fill="#39394f"/><circle cx="14" cy="15" r="3" fill="#ff8a80"/><circle cx="25" cy="15" r="3" fill="#ffce74"/><circle cx="36" cy="15" r="3" fill="#8dde9c"/><text x="100" y="58" text-anchor="middle" fill="#39394f" font-size="14" font-weight="700">Focused window</text><text x="100" y="80" text-anchor="middle" fill="#747385" font-size="11">Your app stays in view</text><rect x="54" y="92" width="92" height="5" rx="2.5" fill="#dedbe8"/></g><text x="178" y="225" text-anchor="middle" fill="#ece8f4" font-size="11">Workspace 2</text></g>
    <path d="M178 380C228 367 266 365 318 377" fill="none" stroke="#b99aff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="205" y="360" class="label" font-size="12">SWIPE</text>
    <g transform="translate(119 410)"><path d="M12 5Q0 6 0 20V96Q0 108 12 110H174Q186 108 186 96V20Q186 6 174 5Z" fill="#292a38" stroke="#6b6680" stroke-width="2"/><path d="M2 74H184" stroke="#59566b" stroke-width="1.5"/><g fill="url(#accent)" stroke="#e1d4ff" stroke-width="1"><circle cx="56" cy="43" r="11"/><circle cx="83" cy="43" r="11"/><circle cx="110" cy="43" r="11"/><circle cx="137" cy="43" r="11"/></g><path d="M51 43H145" stroke="#f4ecff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="93" y="97" text-anchor="middle" class="muted" font-size="12">four fingers</text></g><text x="206" y="550" text-anchor="middle" class="muted" font-size="13">Move the focused window toward its neighbor.</text>
  </g>
  <g transform="translate(514 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">2</text><text x="70" y="48" class="bright" font-size="22" font-weight="700">Place it next door</text><text x="30" y="82" class="muted" font-size="15">Release to finish the move to an adjacent workspace.</text>
    <g transform="translate(31 136)"><rect width="156" height="176" rx="13" fill="#222338" stroke="#504d69" stroke-width="1.5"/><text x="78" y="25" text-anchor="middle" class="muted" font-size="12">WORKSPACE 2</text><rect x="19" y="45" width="118" height="91" rx="8" fill="url(#wallpaper)"/><rect x="39" y="68" width="78" height="49" rx="5" fill="#f4f2f8"/><path d="M44 68H112a5 5 0 0 1 5 5v10H39V73a5 5 0 0 1 5-5Z" fill="#3b3a4d"/><text x="78" y="103" text-anchor="middle" fill="#777486" font-size="9">Other windows</text><text x="78" y="158" text-anchor="middle" class="muted" font-size="11">Window leaves</text></g>
    <path d="M203 224H295" fill="none" stroke="#b99aff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="249" y="207" text-anchor="middle" class="label" font-size="11">ONE WORKSPACE</text>
    <g transform="translate(225 136)"><rect width="156" height="176" rx="13" fill="#292541" stroke="#a78aff" stroke-width="2.5"/><text x="78" y="25" text-anchor="middle" fill="#d6c5ff" font-size="12" font-weight="700">WORKSPACE 3</text><rect x="19" y="45" width="118" height="91" rx="8" fill="url(#wallpaper)"/><rect x="39" y="68" width="78" height="49" rx="5" fill="#f4f2f8"/><path d="M44 68H112a5 5 0 0 1 5 5v10H39V73a5 5 0 0 1 5-5Z" fill="#3b3a4d"/><text x="78" y="103" text-anchor="middle" fill="#4d387f" font-size="9" font-weight="700">Your window</text><text x="78" y="158" text-anchor="middle" fill="#d6c5ff" font-size="11">Window arrives</text></g>
    <g transform="translate(60 364)"><rect width="292" height="142" rx="18" fill="#202033" stroke="#393750"/><text x="146" y="32" text-anchor="middle" class="label" font-size="12">WORKSPACE STRIP</text><g transform="translate(30 51)"><rect width="68" height="53" rx="7" fill="#42415a"/><rect x="11" y="12" width="46" height="30" rx="4" fill="#dcd8e9" opacity=".45"/><text x="34" y="72" text-anchor="middle" class="muted" font-size="10">1</text></g><g transform="translate(112 51)"><rect width="68" height="53" rx="7" fill="#42415a"/><text x="34" y="72" text-anchor="middle" class="muted" font-size="10">2</text></g><g transform="translate(194 51)"><rect width="68" height="53" rx="7" fill="#62518d" stroke="#b99aff" stroke-width="2"/><rect x="17" y="13" width="35" height="26" rx="4" fill="#f6f4fa"/><text x="34" y="72" text-anchor="middle" fill="#d7c7ff" font-size="10">3 · moved window</text></g></g><text x="206" y="550" text-anchor="middle" class="muted" font-size="13">The focused window is now on Workspace 3.</text>
  </g>
  <g transform="translate(970 218)"><rect width="412" height="570" rx="24" class="step"/><circle cx="38" cy="43" r="18" fill="url(#accent)"/><text x="38" y="49" text-anchor="middle" fill="#171324" font-size="16" font-weight="800">3</text><text x="70" y="48" class="bright" font-size="22" font-weight="700">Flick to your next task</text><text x="30" y="82" class="muted" font-size="15">Use three fingers to switch workspaces independently.</text>
    <g transform="translate(31 117)" filter="url(#shadow)"><rect width="350" height="216" rx="13" fill="#11121b" stroke="#504d69" stroke-width="1.5"/><path d="M13 0H337a13 13 0 0 1 13 13v23H0V13A13 13 0 0 1 13 0Z" fill="#2b2a3c"/><text x="19" y="24" fill="#eeeaf8" font-size="11" font-weight="600">Activities</text><text x="175" y="24" fill="#d7d3e4" font-size="10" text-anchor="middle">Tue 10:09</text><rect y="36" width="350" height="180" fill="url(#wallpaper)"/><path d="M0 166C62 101 109 162 164 115S254 97 350 148V180H0Z" fill="#7766ac" opacity=".42"/><rect x="83" y="75" width="184" height="105" rx="9" fill="#f6f4fa"/><path d="M92 75H258a9 9 0 0 1 9 9v21H83V84a9 9 0 0 1 9-9Z" fill="#39394f"/><circle cx="97" cy="88" r="3" fill="#ff8a80"/><circle cx="108" cy="88" r="3" fill="#ffce74"/><circle cx="119" cy="88" r="3" fill="#8dde9c"/><text x="175" y="134" text-anchor="middle" fill="#39394f" font-size="14" font-weight="700">Another workspace</text><text x="175" y="155" text-anchor="middle" fill="#747385" font-size="11">The moved window stays behind</text><text x="175" y="205" text-anchor="middle" fill="#ece8f4" font-size="11">Workspace 4</text></g>
    <path d="M179 375C222 362 272 363 322 376" fill="none" stroke="#b99aff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="218" y="354" class="label" font-size="12">SWIPE</text><g transform="translate(130 408)"><path d="M12 5Q0 6 0 20V96Q0 108 12 110H150Q162 108 162 96V20Q162 6 150 5Z" fill="#292a38" stroke="#6b6680" stroke-width="2"/><path d="M2 74H160" stroke="#59566b" stroke-width="1.5"/><g fill="url(#accent)" stroke="#e1d4ff" stroke-width="1"><circle cx="49" cy="43" r="11"/><circle cx="81" cy="43" r="11"/><circle cx="113" cy="43" r="11"/></g><path d="M45 43H120" stroke="#f4ecff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="81" y="97" text-anchor="middle" class="muted" font-size="12">three fingers</text></g><text x="206" y="550" text-anchor="middle" class="muted" font-size="13">Keep moving. Your window is where you left it.</text>
  </g>
  <text x="72" y="850" fill="#aba9bd" font-size="14">Illustration of the default workflow. The extension moves the window one adjacent workspace per four-finger gesture.</text><text x="72" y="877" fill="#77768b" font-size="12">Window Gestures Revived · GNOME Shell extension · Visual guide, not a GNOME Shell screenshot</text>
</svg>
